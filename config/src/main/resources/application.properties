spring.application.name=config
server.port=8012

eureka.client.serviceUrl.defaultZone=http://discovery-server:8010/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.config.server.git.uri=https://github.com/hrasityilmaz/microservices-config.git
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true

#Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Health details
management.endpoint.health.show-details=always

# Kubernetes probes
management.endpoint.health.probes.enabled=true

# Application info
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Spring Cloud Microservice
info.app.version=1.0.0
