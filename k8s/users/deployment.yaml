
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.4.13
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h mysqldb -P 3306 --silent; do
                echo "Waiting for MySQL..."
                sleep 2
              done
              echo "MySQL is ready."

      containers:
        - name: users-service
          image: users-service:1.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          env:
            - name: CONFIG_SERVER_URL
              value: "http://config-server:8012"

            - name: DB_USERNAME
              value: "rst"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

            - name: JWT_SECRET
              value: "073982ebf695e86ee4f96ff02f2fc06aa64004b89921fe0d2aacf0d906bfcba5"

            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=50"

          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
